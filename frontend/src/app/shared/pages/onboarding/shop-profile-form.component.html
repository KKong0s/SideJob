<form [formGroup]="form" (ngSubmit)="submit()" class="profile-form">
  <ion-input
    label="ชื่อร้าน *"
    labelPlacement="floating"
    fill="outline"
    formControlName="shopName"
    errorText="กรุณากรอกชื่อร้าน"
  ></ion-input>

  <ion-textarea
    label="ที่อยู่ร้าน *"
    labelPlacement="floating"
    fill="outline"
    [autoGrow]="true"
    formControlName="address"
    errorText="กรุณากรอกที่อยู่ร้าน"
  ></ion-textarea>

  <ion-input
    class="picker-field"
    label="จังหวัด *"
    labelPlacement="floating"
    fill="outline"
    [readonly]="true"
    placeholder="แตะเพื่อค้นหาจังหวัด"
    [value]="form.controls.provinceId.value ? geo.provinceName(form.controls.provinceId.value) : ''"
    [class.ion-touched]="invalid('provinceId')"
    [class.ion-invalid]="invalid('provinceId')"
    errorText="กรุณาเลือกจังหวัด"
    (click)="chooseProvince()"
    (keydown.enter)="chooseProvince()"
  >
    <ion-icon slot="end" name="chevron-down" aria-hidden="true"></ion-icon>
  </ion-input>

  <ion-input
    class="picker-field"
    [label]="geo.districtLabel(form.controls.provinceId.value) + ' *'"
    labelPlacement="floating"
    fill="outline"
    [readonly]="true"
    [placeholder]="form.controls.provinceId.value ? 'แตะเพื่อค้นหา' : 'เลือกจังหวัดก่อน'"
    [value]="form.controls.districtId.value ? geo.districtName(form.controls.districtId.value) : ''"
    [class.ion-touched]="invalid('districtId')"
    [class.ion-invalid]="invalid('districtId')"
    [errorText]="'กรุณาเลือก' + geo.districtLabel(form.controls.provinceId.value)"
    (click)="chooseDistrict()"
    (keydown.enter)="chooseDistrict()"
  >
    <ion-icon slot="end" name="chevron-down" aria-hidden="true"></ion-icon>
  </ion-input>

  <ion-input
    type="tel"
    inputmode="tel"
    label="เบอร์โทรร้าน *"
    labelPlacement="floating"
    fill="outline"
    formControlName="phone"
    errorText="เบอร์โทรไม่ถูกต้อง เช่น 021234567"
  ></ion-input>

  <ion-input
    label="LINE ID ร้าน"
    labelPlacement="floating"
    fill="outline"
    formControlName="lineId"
    helperText="ผู้หางานจะเห็นเบอร์โทรและ LINE หลังร้านรับเข้าทำงานเท่านั้น"
    errorText="LINE ID ไม่ถูกต้อง"
  ></ion-input>

  <ion-textarea
    label="รายละเอียดร้าน"
    labelPlacement="floating"
    fill="outline"
    [autoGrow]="true"
    [counter]="true"
    [maxlength]="2000"
    formControlName="description"
  ></ion-textarea>

  <ion-note>รูปร้านและเอกสารยืนยันร้าน อัปโหลดได้ในหน้าโปรไฟล์ร้านหลังสมัครเสร็จ</ion-note>

  @if (error()) {
    <ion-note color="danger">{{ error() }}</ion-note>
  }

  <ion-button type="submit" expand="block" [disabled]="busy()">
    @if (busy()) { <ion-spinner name="dots"></ion-spinner> } @else { บันทึกและไปต่อ }
  </ion-button>
</form>
