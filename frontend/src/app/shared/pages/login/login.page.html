<ion-content class="ion-padding">
  <div class="auth-page">
    <div class="brand">
      <h1>SideJob</h1>
      <p>หางานพาร์ทไทม์ใกล้บ้าน</p>
    </div>

    <h2>เข้าสู่ระบบ</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <ion-input
        type="email"
        label="อีเมล"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        formControlName="email"
        errorText="กรุณากรอกอีเมลให้ถูกต้อง"
      ></ion-input>

      <ion-input
        type="password"
        label="รหัสผ่าน"
        labelPlacement="floating"
        fill="outline"
        autocomplete="current-password"
        formControlName="password"
        errorText="กรุณากรอกรหัสผ่าน"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (error()) {
        <ion-note color="danger">{{ error() }}</ion-note>
      }

      <ion-button type="submit" expand="block" [disabled]="busy()">
        @if (busy()) { <ion-spinner name="dots"></ion-spinner> } @else { เข้าสู่ระบบ }
      </ion-button>
    </form>

    <app-google-auth (signedIn)="goHome($event)"></app-google-auth>

    <p class="switch">
      ยังไม่มีบัญชี? <a routerLink="/register">สมัครสมาชิก</a>
    </p>
  </div>
</ion-content>
