<ion-content class="auth-bg">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-intro">
        <div class="auth-logo" aria-hidden="true">S</div>
        <h1>สร้างบัญชี SideJob</h1>
        <p>สมัครครั้งเดียว แล้วเลือกได้ว่าจะหางาน หรือเปิดร้านเพื่อประกาศหาคนช่วยงาน</p>
      </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-main">
      <ion-input
        type="email"
        label="อีเมล"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        formControlName="email"
        errorText="กรุณากรอกอีเมลให้ถูกต้อง"
      ></ion-input>

      <ion-input
        type="password"
        label="รหัสผ่าน"
        labelPlacement="floating"
        fill="outline"
        autocomplete="new-password"
        formControlName="password"
        helperText="อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข"
        errorText="อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        type="password"
        label="ยืนยันรหัสผ่าน"
        labelPlacement="floating"
        fill="outline"
        autocomplete="new-password"
        formControlName="confirm"
        errorText="กรุณายืนยันรหัสผ่าน"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (form.hasError('mismatch') && form.controls.confirm.touched) {
        <ion-note color="danger">รหัสผ่านทั้งสองช่องไม่ตรงกัน</ion-note>
      }
      @if (error()) {
        <ion-note color="danger">{{ error() }}</ion-note>
      }

      <div class="auth-actions">
        <a class="auth-link" routerLink="/login">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
        <ion-button type="submit" shape="round" [disabled]="busy()">
          @if (busy()) { <ion-spinner name="dots"></ion-spinner> } @else { สมัครสมาชิก }
        </ion-button>
      </div>
    </form>
    </div>

    <app-google-auth (signedIn)="goNext($event)"></app-google-auth>
  </div>
</ion-content>
